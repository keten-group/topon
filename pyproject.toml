[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topon"
version = "0.3.0"
description = "A modular Python package for polymer network generation and LAMMPS input file creation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ahmet Burak Yildirim"}
]
requires-python = ">=3.9"
keywords = ["polymer", "network", "simulation", "LAMMPS", "molecular dynamics", "coarse-grained"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "networkx>=3.0",
    "numpy>=1.21",
    "pandas>=1.4",
    "rdkit>=2023.3.1",
    "pydantic>=2.0",
    "click>=8.0",
    "plotly>=5.0",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
# Martini 3 chain topologies for any sequence (topon protein --model martini).
# polyply 1.8 imports cgsmiles (and through it pysmiles) without declaring it.
martini = [
    "polyply>=1.8",
    "cgsmiles>=1.0",
]
# OpenMM, for checking LAMMPS energies of the CHARMM output against an
# independent CHARMM implementation
validate = [
    "openmm>=8.0",
]

[project.scripts]
topon = "topon.cli:main"

[project.urls]
Homepage = "https://github.com/keten-group/topon"
Repository = "https://github.com/keten-group/topon"

[tool.setuptools.packages.find]
where = ["."]
include = ["topon*"]

[tool.setuptools.package-data]
# The DREIDING parameter files are read at run time, the presets back
# `topon init --preset`, and topology/csrc holds the C generator's source,
# which has no __init__.py and so is not picked up as a package. Listing them
# here keeps them in a regular (non-editable) install. The force-field files
# of the CHARMM and Martini routes are data too (C35r ethers, CHARMM36m,
# Martini 3), each folder with its licence.
topon = [
    "data/*",
    "presets/*.json",
    "forcefield/*.txt",
    "utils/*.txt",
    "topology/csrc/*.c",
    "topology/csrc/*.md",
    "chemistry/charmm/data/*",
    "protein_network/data/*",
    "protein_network/charmm/data/*",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
